<div id="pg"></div>

<script>
/* Повна копія лендингу «Моє здорове тіло» (moje-zdorove-tilo.weblium.site) без ціни.
   Сторінка підтягує актуальний лендинг з Weblium при кожному відкритті:
   прибирає блоки з ціною й бронюванням, а всі кнопки продажу замінює на «Дізнатись деталі» → Telegram. */

function transformProgram(seg){
  var SRC='https://moje-zdorove-tilo.weblium.site';
  var TG='https://t.me/snizhana_strokova';
  var LABEL='Дізнатись деталі';
  var tp=document.createElement('template'); tp.innerHTML=seg; var f=tp.content;
  // head-only елементи з embed
  f.querySelectorAll('meta,title').forEach(function(e){e.remove()});
  // секції з ціною і бронюванням
  ['#price','#book'].forEach(function(s){var e=f.querySelector(s); if(e) e.remove();});
  // кнопки продажу -> «Дізнатись деталі» на Telegram; у кожній групі лишається одна
  var sel='[data-book],[data-full],[data-parts],[data-pay]';
  var groups=new Map();
  f.querySelectorAll(sel).forEach(function(a){
    var p=a.parentElement; if(!groups.has(p)) groups.set(p,[]); groups.get(p).push(a);
  });
  groups.forEach(function(list){
    list.forEach(function(a,i){
      if(i>0){a.remove();return;}
      ['data-book','data-full','data-parts','data-pay'].forEach(function(k){a.removeAttribute(k)});
      a.setAttribute('href',TG); a.setAttribute('target','_blank'); a.setAttribute('rel','noopener');
      a.classList.remove('btn--ghost','btn--dark','dock-only-d');
      var i2=a.querySelector('i'); if(i2) i2.textContent=LABEL; else a.textContent=LABEL;
    });
  });
  // підписи про оплату та інструкції розтермінування
  f.querySelectorAll('p,small,details,div').forEach(function(e){
    var t=e.textContent;
    t=t.replace(/\s+/g,' ').trim(); if((/^Натискаючи кнопку оплати/.test(t) || /^Як оплатити частинами/.test(t)) && t.length<500) e.remove();
  });
  // елементи, що містять лише ціну
  var w=document.createTreeWalker(f,NodeFilter.SHOW_TEXT); var kill=[];
  while(w.nextNode()){var n=w.currentNode; var pt=n.parentElement&&n.parentElement.tagName; if(pt==='SCRIPT'||pt==='STYLE') continue; if(/\d\s*€/.test(n.nodeValue)) kill.push(n);}
  kill.forEach(function(n){
    var v=n.nodeValue.replace(/\s*·\s*\d[\d\s]*€/g,'').replace(/\d[\d\s]*€/g,'').replace(/\s+$/,'');
    if(!v.trim()){var el=n.parentElement; n.remove(); if(el && !el.textContent.trim() && !el.querySelector('img,svg')) el.remove();}
    else n.nodeValue=v;
  });
  // відносні посилання -> на основний сайт
  f.querySelectorAll('a[href^="/"]').forEach(function(a){a.setAttribute('href',SRC+a.getAttribute('href'))});
  f.querySelectorAll('img[src^="./"],img[src^="/"]').forEach(function(im){im.setAttribute('src',SRC+'/'+im.getAttribute('src').replace(/^\.?\//,''))});
  return f;
}

(function(){
  var SRC='https://moje-zdorove-tilo.weblium.site/';
  function fail(){
    document.getElementById('pg-load').innerHTML='<p>Не вдалося завантажити сторінку.</p><a href="https://t.me/snizhana_strokova" target="_blank" rel="noopener">Дізнатись деталі</a>';
  }
  fetch(SRC,{cache:'no-store'}).then(function(r){if(!r.ok) throw 0; return r.text();}).then(function(t){
    var a=t.indexOf('data-embed-id='); if(a<0) throw 0;
    var gt=t.indexOf('>',a)+1, b=t.indexOf('<!--CONTENT_PLACEHOLDER-->',a); if(b<0) throw 0;
    var f=transformProgram(t.slice(gt,b));
    var scripts=[].slice.call(f.querySelectorAll('script'));
    var holder=document.getElementById('pg');
    scripts.forEach(function(s){s.remove()});
    holder.appendChild(f);
    document.getElementById('pg-load').remove();
    scripts.forEach(function(s){var n=document.createElement('script'); [].forEach.call(s.attributes,function(at){n.setAttribute(at.name,at.value)}); n.text=s.textContent; holder.appendChild(n);});
    if(location.hash){var el=document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView();}
  }).catch(fail);
})();
</script>
